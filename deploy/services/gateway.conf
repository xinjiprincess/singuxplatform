events {}
http {
  resolver 127.0.0.11 valid=10s;
  client_max_body_size 100m;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  server {
    listen 8090;
    location / {
      set $upstream http://singux-rcoder:8090;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }
  }
  server {
    listen 8088;
    location ~ "^/proxy/(?<preview_port>4[0-9]{3})(?<preview_path>/.*)$" {
      proxy_pass http://singux-file-service:$preview_port$preview_path$is_args$args;
      proxy_set_header Host localhost;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }
    location / {
      set $upstream http://singux-rcoder:8088;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }
  }
  server {
    listen 4000;
    location / {
      set $upstream http://singux-file-service:4000;
      proxy_pass $upstream;
      proxy_set_header Host localhost;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
  server {
    listen 60000;
    location / {
      set $upstream http://singux-file-service:60000;
      proxy_pass $upstream;
    }
  }
}
